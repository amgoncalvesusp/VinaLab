[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vinalab"
version = "2.0.0a0"
description = "Cross-platform molecular docking workbench"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["PySide6>=6.7"]
dev = ["pytest>=8.0", "ruff>=0.6"]
build = ["PyInstaller>=6.0"]

[project.scripts]
vinalab = "vinalab_ui.main:main"
vinalab-cli = "vinalab_cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
