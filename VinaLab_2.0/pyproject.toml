[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "vinalab_build"
backend-path = ["packaging"]

[project]
name = "vinalab"
version = "2.0.1"
description = "Cross-platform molecular docking workbench"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7", "rdkit", "meeko", "gemmi", "openbabel-wheel", "scipy", "numpy",
]

[project.optional-dependencies]
ui = ["PySide6>=6.7"]
dev = ["pytest>=8.0", "pytest-cov>=5", "ruff>=0.6"]
build = ["PyInstaller>=6.0", "build", "wheel", "setuptools>=83.0.0"]

[tool.setuptools.packages.find]
include = ["vinalab_core*", "vinalab_ui*", "vinalab_cli*"]
exclude = ["packaging*", "tools*", "tests*"]

[tool.setuptools.package-data]
vinalab_ui = ["assets/*", "assets/**/*", "widgets/assets/*", "widgets/assets/**/*"]
vinalab_core = ["_bundled/**/*"]

[project.scripts]
vinalab = "vinalab_ui.main:main"
vinalab-cli = "vinalab_cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.report]
# Installation tests import temporary wheel copies; measure this checkout once.
include = ["vinalab_core/*", "vinalab_ui/*"]
fail_under = 80
