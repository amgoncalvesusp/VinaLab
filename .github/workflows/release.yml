name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: windows-x64
            artifact_name: vinalab-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-build.txt

      - name: Check release metadata
        run: python scripts/check_release_consistency.py

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            patchelf

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-build.txt

      - name: Check runtime dependencies
        run: python scripts/check_runtime_dependencies.py

      - name: Run tests
        run: python -m pytest tests -q --tb=short

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean VinaGUI.spec

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Build Windows setup installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "packaging/windows/VinaLab.iss"

      - name: Package artifacts
        run: python scripts/package_release.py --output-dir artifacts

      - name: Verify Windows release artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $setup = "artifacts\VinaLab-$version-windows-x64-setup.exe"
          $portable = "artifacts\VinaLab-$version-windows-x64-portable.zip"
          if (!(Test-Path $setup)) { throw "Missing setup installer: $setup" }
          if (!(Test-Path $portable)) { throw "Missing portable archive: $portable" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $portable))
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName }
            foreach ($required in @("VinaLab.exe", "VERSION", "README.md", "RELEASE_NOTES_$version.md")) {
              if ($names -notcontains $required) { throw "Portable archive missing $required" }
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES_0.0.7.md
          files: release-assets/**/*
          overwrite_files: true
          fail_on_unmatched_files: true
