name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: Build the Mac test installers from the selected source ref
        type: choice
        options:
          - full-release
          - macos-preview
        default: full-release

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target != 'macos-preview' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: windows-x64
            artifact_name: vinalab-windows-x64
          - os: ubuntu-22.04
            label: ubuntu-x64
            artifact_name: vinalab-ubuntu-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-build.txt

      - name: Check release metadata
        run: python scripts/check_release_consistency.py

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autodock-vina \
            desktop-file-utils \
            libegl1 \
            libgbm1 \
            libgl1 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            openbabel \
            patchelf

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-build.txt

      - name: Check runtime dependencies
        run: python scripts/check_runtime_dependencies.py

      - name: Audit build environment
        run: |
          python -m pip install pip-audit
          python -m pip_audit

      - name: Run tests
        run: python -m pytest tests -q --tb=short

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean VinaGUI.spec

      - name: Smoke test frozen Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/VinaLab.exe -ArgumentList '--smoke-test', 'build-smoke' -WindowStyle Hidden -Wait -PassThru
          Get-Content build-smoke/smoke.json
          if ($process.ExitCode -ne 0) { throw 'Frozen runtime smoke failed' }

      - name: Smoke test frozen Linux runtime
        if: runner.os == 'Linux'
        run: |
          dist/VinaLab --smoke-test build-smoke || { cat build-smoke/smoke.json; exit 1; }
          cat build-smoke/smoke.json

      - name: Upload frozen smoke evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.label }}
          path: build-smoke/*
          if-no-files-found: ignore

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Build Windows setup installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "packaging/windows/VinaLab.iss"

      - name: Package artifacts
        run: python scripts/package_release.py --output-dir artifacts

      - name: Verify Windows release artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $setup = "artifacts\VinaLab-Light-$version-windows-x64-setup.exe"
          $portable = "artifacts\VinaLab-Light-$version-windows-x64-portable.zip"
          if (!(Test-Path $setup)) { throw "Missing setup installer: $setup" }
          if (!(Test-Path $portable)) { throw "Missing portable archive: $portable" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $portable))
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName }
            foreach ($required in @("VinaLab.exe", "VERSION", "README.md", "RELEASE_NOTES_$version.md")) {
              if ($names -notcontains $required) { throw "Portable archive missing $required" }
            }
          } finally {
            $zip.Dispose()
          }

      - name: Verify Ubuntu release artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          deb="artifacts/VinaLab-Light-${version}-ubuntu-x64.deb"
          tarball="artifacts/VinaLab-Light-${version}-linux-x64.tar.gz"
          test -f "$deb"
          test -f "$tarball"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -E '/opt/vinalab/VinaLab$'
          dpkg-deb --contents "$deb" | grep -E '/usr/bin/vinalab$'
          dpkg-deb --contents "$deb" | grep -E '/usr/share/applications/vinalab.desktop$'
          dpkg-deb --contents "$deb" | grep -E '/usr/share/icons/hicolor/256x256/apps/vinalab.png$'
          tar -tzf "$tarball" | grep -E '^VinaLab$'
          desktop-file-validate packaging/linux/vinalab.desktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/*
          if-no-files-found: error

  build_macos_preview:
    name: Build ${{ matrix.label }} test installer
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'macos-preview' }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos-arm64
            artifact_name: vinalab-macos-arm64
            expected_arch: arm64
            release_arch: arm64
          - os: macos-15-intel
            label: macos-x64
            artifact_name: vinalab-macos-x64
            expected_arch: x86_64
            release_arch: x64

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-build.txt

      - name: Check release metadata
        run: python scripts/check_release_consistency.py

      - name: Install the official AutoDock Vina macOS binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/vina
          case "$(uname -m)" in
            arm64)
              asset="vina_1.2.7_mac_aarch64"
              sha256="823c2bbacf26d72183861322345f0a89736aca66c8e81054c66f93af5ad623f1"
              ;;
            x86_64)
              asset="vina_1.2.7_mac_x86_64"
              sha256="9f44ccbb163223613283a75d0be53235d9e63f4da08292cb7196144f9838b7f9"
              ;;
            *)
              echo "Unsupported Mac runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/ccsb-scripps/AutoDock-Vina/releases/download/v1.2.7/${asset}" \
            --output tools/vina/vina
          printf '%s  %s\n' "$sha256" tools/vina/vina | shasum -a 256 --check
          chmod 0755 tools/vina/vina
          ./tools/vina/vina --version

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools==80.9.0' wheel
          python -m pip install -r requirements-build.txt

      - name: Check runtime dependencies
        run: python scripts/check_runtime_dependencies.py

      - name: Audit build environment
        run: |
          python -m pip install pip-audit
          python -m pip_audit

      - name: Run tests
        run: python -m pytest tests -q --tb=short

      - name: Build macOS app bundle
        run: |
          set -euo pipefail
          iconset="build/VinaLab.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -s format png -z "$size" "$size" ui/icon.png \
              --out "$iconset/icon_${size}x${size}.png" >/dev/null
            doubled=$((size * 2))
            sips -s format png -z "$doubled" "$doubled" ui/icon.png \
              --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o ui/icon.icns
          python -m PyInstaller --noconfirm --clean VinaGUI.spec

      - name: Smoke test frozen macOS runtime
        shell: bash
        run: |
          set -euo pipefail
          app="dist/VinaLab.app"
          executable="$app/Contents/MacOS/VinaLab"
          test -d "$app"
          test -x "$executable"
          plutil -lint "$app/Contents/Info.plist"
          actual_arch="$(lipo -archs "$executable")"
          if [[ "$actual_arch" != "${{ matrix.expected_arch }}" ]]; then
            echo "Expected ${{ matrix.expected_arch }} app, got $actual_arch" >&2
            exit 1
          fi
          "$executable" --smoke-test build-smoke || { cat build-smoke/smoke.json; exit 1; }
          cat build-smoke/smoke.json

      - name: Upload frozen smoke evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.label }}
          path: build-smoke/*
          if-no-files-found: ignore

      - name: Package Mac test installer
        run: python scripts/package_release.py --output-dir artifacts

      - name: Verify Mac test installer
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          image="artifacts/VinaLab-Light-${version}-macos-${{ matrix.release_arch }}-unsigned-preview.dmg"
          test -f "$image"
          hdiutil verify "$image"
          shasum -a 256 --check artifacts/SHA256SUMS-macos.txt
          hdiutil imageinfo "$image"

      - name: Upload Mac test installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: vinalab-*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES_1.1.1.md
          name: VinaLab Light ${{ github.ref_name }}
          files: release-assets/**/*
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
